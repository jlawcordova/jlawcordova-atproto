name: Deploy jlawcordova-mcp

on:
  push:
    branches: [main]
    paths:
      - "jlawcordova-mcp/**"
      - "shared/**"
      - "lexicons/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/deploy-mcp.yml"
  # Test (but don't deploy) pull requests so a broken Worker is caught before merging.
  pull_request:
    branches: [main]
    paths:
      - "jlawcordova-mcp/**"
      - "shared/**"
      - "lexicons/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: deploy-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # Bundles the Worker without uploading it, so a build error fails the PR.
      - name: Check the Worker bundles
        working-directory: jlawcordova-mcp
        run: npx wrangler deploy --dry-run

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      # Vars come from wrangler.jsonc. Secrets are set with `wrangler secret put`
      # and are left untouched by a deploy.
      - name: Deploy
        working-directory: jlawcordova-mcp
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
