name: Deploy jlawcordova-mcp

on:
  push:
    branches: [main]
    paths:
      - "jlawcordova-mcp/**"
      - "shared/**"
      - "lexicons/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-mcp.yml"
  # Test (but don't deploy) pull requests so a broken Worker is caught before merging.
  pull_request:
    branches: [main]
    paths:
      - "jlawcordova-mcp/**"
      - "shared/**"
      - "lexicons/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: deploy-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The Bun version comes from packageManager in the root package.json.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      # Bundles the Worker without uploading it, so a build error fails the PR.
      - name: Check the Worker bundles
        run: bun run --filter jlawcordova-mcp check

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The Bun version comes from packageManager in the root package.json.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      # Vars come from wrangler.jsonc. Secrets are set with `wrangler secret put`
      # and are left untouched by a deploy.
      - name: Deploy
        run: bun run --filter jlawcordova-mcp deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
